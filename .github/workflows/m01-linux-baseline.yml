name: M01 Linux Baseline

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m01-linux-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  linux-baseline:
    name: Authoritative Linux Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "1"
      FORCE_COLOR: "0"
      NO_COLOR: "1"

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6

      - name: Install Node.js 22.20.0
        uses: actions/setup-node@v6
        with:
          node-version: 22.20.0

      - name: Activate pnpm 10.28.0
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

          test "$(node --version)" = "v22.20.0"
          test "$(pnpm --version)" = "10.28.0"

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Run authoritative Linux commands
        id: baseline
        shell: bash
        run: |
          set -euo pipefail

          evidence="m01-linux-baseline"
          mkdir -p "$evidence"

          run_capture() {
            local id="$1"
            shift

            printf '%s\n' "$*" > "$evidence/$id.command.txt"

            set +e
            "$@" 2>&1 | tee "$evidence/$id.log.txt"
            local code="${PIPESTATUS[0]}"
            set -e

            printf '%s\n' "$code" > "$evidence/$id.exit-code.txt"
          }

          run_capture \
            baseline-test \
            pnpm baseline:test

          run_capture \
            characterization-foundation \
            pnpm \
              --filter @tunarr/server \
              exec vitest \
              --config vitest.characterization.config.ts \
              --typecheck.tsconfig tsconfig.test.json \
              --run

          run_capture \
            build \
            pnpm build

          run_capture \
            full-test \
            pnpm test

          git status --porcelain=v1 \
            > "$evidence/git-status-before-restore.txt"

          unexpected="$(
            git status --porcelain=v1 |
              grep -vE '^ M server/src/generated/env\.ts$' ||
              true
          )"

          if [[ -n "$unexpected" ]]; then
            printf '%s\n' "$unexpected" \
              > "$evidence/unexpected-repository-changes.txt"

            printf '%s\n' "1" \
              > "$evidence/repository-clean.exit-code.txt"
          else
            if git status --porcelain=v1 |
              grep -qE '^ M server/src/generated/env\.ts$'; then
              git restore --worktree -- \
                server/src/generated/env.ts
            fi

            if [[ -n "$(git status --porcelain=v1)" ]]; then
              git status --porcelain=v1 \
                > "$evidence/unexpected-repository-changes.txt"

              printf '%s\n' "1" \
                > "$evidence/repository-clean.exit-code.txt"
            else
              printf '%s\n' "0" \
                > "$evidence/repository-clean.exit-code.txt"
            fi
          fi

          git status --porcelain=v1 \
            > "$evidence/git-status-after-restore.txt"

      - name: Create machine-readable Linux report
        if: always()
        shell: bash
        env:
          TESTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import {
            createHash,
          } from 'node:crypto';

          import {
            execFileSync,
          } from 'node:child_process';

          import {
            readFileSync,
            readdirSync,
            statSync,
            writeFileSync,
          } from 'node:fs';

          import {
            join,
          } from 'node:path';

          const directory = 'm01-linux-baseline';

          const commandIds = [
            'baseline-test',
            'characterization-foundation',
            'build',
            'full-test',
          ];

          const text = (path) =>
            readFileSync(path, 'utf8')
              .replace(/\r\n/g, '\n');

          const sha256 = (buffer) =>
            createHash('sha256')
              .update(buffer)
              .digest('hex');

          const command = (name, args) =>
            execFileSync(name, args, {
              encoding: 'utf8',
            }).trim();

          const commands = commandIds.map((id) => {
            const logPath = join(
              directory,
              `${id}.log.txt`,
            );

            const commandPath = join(
              directory,
              `${id}.command.txt`,
            );

            const exitPath = join(
              directory,
              `${id}.exit-code.txt`,
            );

            const log = readFileSync(logPath);

            return {
              id,
              command: text(commandPath).trim(),
              exitCode: Number.parseInt(
                text(exitPath).trim(),
                10,
              ),
              log: {
                file: `${id}.log.txt`,
                bytes: log.length,
                sha256: sha256(log),
              },
            };
          });

          const report = {
            schemaVersion: 1,
            generatedAtUtc: new Date().toISOString(),
            source: {
              repository:
                process.env.GITHUB_REPOSITORY,
              testedHeadSha:
                process.env.TESTED_HEAD_SHA,
              workflowSha:
                process.env.GITHUB_SHA,
              ref:
                process.env.GITHUB_REF,
              headRef:
                process.env.GITHUB_HEAD_REF || null,
              runId:
                process.env.GITHUB_RUN_ID,
              runAttempt:
                process.env.GITHUB_RUN_ATTEMPT,
            },
            platform: {
              runnerOs:
                process.env.RUNNER_OS,
              runnerArchitecture:
                process.env.RUNNER_ARCH,
              imageOs:
                process.env.ImageOS || null,
              imageVersion:
                process.env.ImageVersion || null,
              kernel: command('uname', ['-a']),
              nodeVersion:
                process.version,
              pnpmVersion:
                command('pnpm', ['--version']),
              gitVersion:
                command('git', ['--version']),
            },
            scope: {
              milestone: 'M01',
              pullRequestUnit: '01G',
              authoritativePlatform: 'linux',
              runtimeBehaviorChanged: false,
            },
            commands,
            repository: {
              cleanExitCode: Number.parseInt(
                text(
                  join(
                    directory,
                    'repository-clean.exit-code.txt',
                  ),
                ).trim(),
                10,
              ),
              statusBeforeRestore: text(
                join(
                  directory,
                  'git-status-before-restore.txt',
                ),
              ).trim(),
              statusAfterRestore: text(
                join(
                  directory,
                  'git-status-after-restore.txt',
                ),
              ).trim(),
            },
          };

          writeFileSync(
            join(
              directory,
              'linux-baseline-report.json',
            ),
            `${JSON.stringify(report, null, 2)}\n`,
            'utf8',
          );

          const manifest = {
            schemaVersion: 1,
            generatedAtUtc:
              report.generatedAtUtc,
            files: readdirSync(directory)
              .filter(
                (name) =>
                  name !== 'manifest.json',
              )
              .sort()
              .map((name) => {
                const path = join(
                  directory,
                  name,
                );

                const contents =
                  readFileSync(path);

                return {
                  file: name,
                  bytes:
                    statSync(path).size,
                  sha256:
                    sha256(contents),
                };
              }),
          };

          writeFileSync(
            join(
              directory,
              'manifest.json',
            ),
            `${JSON.stringify(manifest, null, 2)}\n`,
            'utf8',
          );
          NODE

      - name: Upload Linux baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-linux-baseline
          path: m01-linux-baseline
          if-no-files-found: error
          retention-days: 30

      - name: Enforce authoritative Linux baseline
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          evidence="m01-linux-baseline"
          failed=0

          for id in \
            baseline-test \
            characterization-foundation \
            build \
            full-test \
            repository-clean
          do
            code="$(
              cat "$evidence/$id.exit-code.txt"
            )"

            printf '%-32s %s\n' "$id" "$code"

            if [[ "$code" != "0" ]]; then
              failed=1
            fi
          done

          exit "$failed"

name: Architecture

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  architecture:
    name: Boundary Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js 22.20.0
        uses: actions/setup-node@v6
        with:
          node-version: 22.20.0

      - name: Activate pnpm 10.28.0
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          node --version
          pnpm --version

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run architecture tests
        run: pnpm test:architecture
